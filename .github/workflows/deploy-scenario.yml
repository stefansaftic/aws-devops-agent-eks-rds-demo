name: deploy-scenario

# Deploys the EKS-FAIL-DEMO workload manifests to the demo cluster.
# Each scenario branch contains a single broken-by-design diff (bad image,
# OOM limits, wrong DB name, broken SQL) so merging the PR triggers the
# failure that DevOps Agent will then investigate.

on:
  # Triggers on push to the `deploy` branch and on manual dispatch only.
  # Demo flow:
  #   - main is the clean baseline; never deploys directly
  #   - PR a scenario/* branch into `deploy`; merging fires this workflow
  #   - after the demo, scripts/reset-deploy.sh resets deploy back to main
  # That way main stays uncluttered by demo merges/reverts.
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to deploy (e.g. scenario/bad-image-tag)'
        required: false
        default: 'deploy'

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: devops-agent-demo

jobs:
  deploy:
    name: deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On workflow_dispatch, honour the user's chosen ref (e.g. a
          # scenario branch). On a real push, github.ref already points
          # at the merged commit on main.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Setting this makes the assumed role's session name visible in
          # CloudTrail as the GitHub run id, which is useful when DevOps
          # Agent traces "who deployed this".
          role-session-name: gha-${{ github.run_id }}

      - name: Resolve cluster name
        id: cluster
        run: |
          CLUSTER=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue" \
            --output text)
          if [[ -z "$CLUSTER" || "$CLUSTER" == "None" ]]; then
            echo "::error::Cluster not found. Did you run scripts/deploy.sh first?"
            exit 1
          fi
          echo "name=$CLUSTER" >> "$GITHUB_OUTPUT"
          echo "Cluster: $CLUSTER"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ steps.cluster.outputs.name }}" --region "$AWS_REGION"

      - name: Resolve RDS endpoint
        id: rds
        run: |
          RDS_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='RdsEndpoint'].OutputValue" \
            --output text)
          echo "endpoint=$RDS_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "RDS: $RDS_ENDPOINT"

      - name: Deploy API workload (with whatever the branch contains)
        run: |
          set -euo pipefail
          echo "==> Deploying ref: ${{ github.ref_name }}  sha: ${{ github.sha }}"
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          ECR_PREFIX="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/ecr-public"
          # Annotate the deployment with the commit so investigators can
          # cross-reference cluster state with git history.
          sed -e "s|PLACEHOLDER_RDS_ENDPOINT|${{ steps.rds.outputs.endpoint }}|g" \
              -e "s|__ECR_PREFIX__|${ECR_PREFIX}|g" \
              workload/api-app.yaml | kubectl apply -f -
          kubectl annotate deployment/api-server -n api-demo \
            "eks-fail-demo/git-sha=${{ github.sha }}" \
            "eks-fail-demo/git-ref=${{ github.ref_name }}" \
            "eks-fail-demo/gha-run=${{ github.run_id }}" \
            --overwrite

      - name: Show rollout status (do not fail the job on rollout failure)
        # We intentionally let bad scenarios "succeed" the workflow so the
        # cluster is left in the broken state DevOps Agent will inspect.
        # The workflow's job here is to deploy, not to validate.
        continue-on-error: true
        run: |
          kubectl rollout status deployment/api-server -n api-demo --timeout=90s || true
          kubectl get pods -n api-demo -o wide
          kubectl describe deployment/api-server -n api-demo | tail -40

      # ----- CFN updates (cost-optimization scenario) -----
      # If the branch changes anything under cfn/**, re-upload the
      # nested templates to the existing template bucket and run
      # cloudformation update-stack on the parent. The scenario branch
      # for this is `scenario/cost-optimization` which drops the gp3
      # data volume's Iops and Throughput properties.
      - name: Detect CFN changes
        id: cfn-detect
        run: |
          # Compare against deploy's previous tip; if that's missing
          # (first run, force-push), fall back to the parent commit.
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          CHANGED=$(git diff --name-only "$BEFORE" HEAD -- cfn/ || true)
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED"     >> "$GITHUB_OUTPUT"
          echo "EOF"          >> "$GITHUB_OUTPUT"
          if [[ -n "$CHANGED" ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed CFN files:"; echo "$CHANGED"

      - name: Apply CFN update
        if: steps.cfn-detect.outputs.any == 'true'
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="${STACK_NAME}-templates-${ACCOUNT}-${AWS_REGION}"
          PREFIX="${STACK_NAME}"
          echo "==> Re-uploading nested templates to s3://${BUCKET}/${PREFIX}/"
          aws s3 cp cfn/ec2-postgres.yaml "s3://${BUCKET}/${PREFIX}/ec2-postgres.yaml"
          aws s3 cp cfn/eks.yaml          "s3://${BUCKET}/${PREFIX}/eks.yaml"
          aws s3 cp cfn/rds.yaml          "s3://${BUCKET}/${PREFIX}/rds.yaml"
          aws s3 cp cfn/fis.yaml          "s3://${BUCKET}/${PREFIX}/fis.yaml"
          aws s3 cp cfn/vpc.yaml          "s3://${BUCKET}/${PREFIX}/vpc.yaml"

          # CFN won't re-fetch a nested stack's TemplateURL just because
          # the S3 object behind it changed. We have to update the
          # nested stack directly, passing the (same) URL as
          # --template-url so CFN re-reads the body and diffs against
          # the deployed state. That's how the gp3 IOPS/Throughput
          # change in cfn/ec2-postgres.yaml actually reaches AWS.
          NESTED_ARN=$(aws cloudformation describe-stack-resource \
            --stack-name "${STACK_NAME}" \
            --logical-resource-id Ec2PostgresStack \
            --query "StackResourceDetail.PhysicalResourceId" --output text)
          echo "==> Updating nested stack: $NESTED_ARN"
          aws cloudformation update-stack \
            --stack-name "$NESTED_ARN" \
            --template-url "https://${BUCKET}.s3.amazonaws.com/${PREFIX}/ec2-postgres.yaml" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters \
                ParameterKey=ProjectName,UsePreviousValue=true \
                ParameterKey=VpcId,UsePreviousValue=true \
                ParameterKey=VpcCidr,UsePreviousValue=true \
                ParameterKey=PrivateSubnetA,UsePreviousValue=true \
                ParameterKey=InstanceType,UsePreviousValue=true \
                ParameterKey=DataVolumeSize,UsePreviousValue=true \
                ParameterKey=DataVolumeIops,UsePreviousValue=true \
                ParameterKey=DataVolumeThroughput,UsePreviousValue=true \
                ParameterKey=DbName,UsePreviousValue=true \
                ParameterKey=DbUser,UsePreviousValue=true \
                ParameterKey=DbPassword,UsePreviousValue=true \
                ParameterKey=PgbenchScale,UsePreviousValue=true \
            --tags \
                Key=last-deploy-sha,Value=${{ github.sha }} \
                Key=last-deploy-ref,Value=${{ github.ref_name }} \
                Key=last-deploy-gha-run,Value=${{ github.run_id }} \
                Key=auto-delete,Value=never \
            2>&1 | tee /tmp/upd-nested.log || {
              # "No updates are to be performed" is fine -- means the
              # branch's cfn/** changes don't actually affect this
              # stack (e.g. only vpc.yaml was edited).
              if grep -q "No updates are to be performed" /tmp/upd-nested.log; then
                echo "==> No updates needed for Ec2PostgresStack"
                exit 0
              fi
              exit 1
            }

          echo "==> Waiting for the nested stack to settle"
          aws cloudformation wait stack-update-complete \
            --stack-name "$NESTED_ARN" || \
            echo "    (wait timed out -- CFN still finishing async)"
