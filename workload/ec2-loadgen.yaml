---
# Load generator for the standalone EC2 Postgres (the cost-optimization
# scenario's target). Runs read-only pgbench-shaped SELECTs in a tight
# loop, measures completed transactions per second, and publishes TPS
# to CloudWatch as EksFailDemo/Pgbench:Tps so the dashboard widget
# (defined in cfn/ec2-postgres.yaml) plots the cliff at PR merge time.
#
# Deployed by deploy-rds.sh after the parent stack is up; the EC2 IP
# comes from the CloudFormation output and is patched into the Secret.

apiVersion: v1
kind: Secret
metadata:
  name: ec2-pg-credentials
  namespace: api-demo
type: Opaque
stringData:
  DB_HOST: "PLACEHOLDER_EC2_IP"
  DB_PORT: "5432"
  DB_NAME: "pgbench"
  DB_USER: "pgbench"
  DB_PASSWORD: "PgbenchDemo2026!"
  AWS_REGION: "us-east-1"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ec2-pg-loadgen
  namespace: api-demo
  # Annotation set imperatively after deploy because the IRSA role ARN
  # is a CloudFormation output.
  annotations:
    eks.amazonaws.com/role-arn: "PLACEHOLDER_LOADGEN_ROLE_ARN"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ec2-pg-loadgen
  namespace: api-demo
  labels:
    app: ec2-pg-loadgen
spec:
  # 4 replicas drives sustained ~2800 IOPS against the gp3 volume.
  # That's ~47% of the baseline 6000 IOPS ceiling (comfortable, queue
  # length ~2) but 94% of the 3000 IOPS ceiling. The cost-optimization
  # PR drops to 3000, demand exceeds ceiling, the brownout shows up
  # as a queue-length spike and a TPS drop.
  replicas: 4
  selector:
    matchLabels: {app: ec2-pg-loadgen}
  template:
    metadata:
      labels: {app: ec2-pg-loadgen}
    spec:
      serviceAccountName: ec2-pg-loadgen
      containers:
        - name: loadgen
          image: __ECR_PREFIX__/docker/library/python:3.12-slim
          command: [python, /app/loadgen.py]
          env:
            - {name: DB_HOST,     valueFrom: {secretKeyRef: {name: ec2-pg-credentials, key: DB_HOST}}}
            - {name: DB_PORT,     valueFrom: {secretKeyRef: {name: ec2-pg-credentials, key: DB_PORT}}}
            - {name: DB_NAME,     valueFrom: {secretKeyRef: {name: ec2-pg-credentials, key: DB_NAME}}}
            - {name: DB_USER,     valueFrom: {secretKeyRef: {name: ec2-pg-credentials, key: DB_USER}}}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: ec2-pg-credentials, key: DB_PASSWORD}}}
            - {name: AWS_REGION,  valueFrom: {secretKeyRef: {name: ec2-pg-credentials, key: AWS_REGION}}}
            - {name: AWS_DEFAULT_REGION, valueFrom: {secretKeyRef: {name: ec2-pg-credentials, key: AWS_REGION}}}
          volumeMounts:
            - {name: app-code, mountPath: /app}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits:   {cpu: 1,    memory: 512Mi}
      volumes:
        - name: app-code
          configMap: {name: ec2-pg-loadgen-code}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ec2-pg-loadgen-code
  namespace: api-demo
data:
  loadgen.py: |
    """Continuous Postgres write-heavy workload + CloudWatch TPS publisher.

    Implements the pgbench '-N' transaction (no-vacuum, skip branches/
    tellers updates):

        BEGIN;
        UPDATE pgbench_accounts SET abalance = abalance + :delta WHERE aid = :aid;
        SELECT abalance FROM pgbench_accounts WHERE aid = :aid;
        INSERT INTO pgbench_history (tid, bid, aid, delta, mtime) VALUES (...);
        COMMIT;

    Why writes, not reads: with pgbench scale 1500 (~22 GB) on an 8 GB
    RAM host, a uniform-random read-only workload eventually warms the
    OS page cache for the hot pages that get re-touched. The cache hit
    rate climbs and AWS/EBS VolumeReadOps decays toward zero. The IOPS
    knob the cost-optimization scenario tweaks then has no visible
    effect on TPS.

    Writes don't have that problem: every COMMIT triggers fsync on WAL,
    and dirty data pages get written back to /data on the next
    checkpoint regardless of cache state. VolumeWriteOps stays high
    indefinitely, the workload becomes IOPS-bound, and the demo cliff
    is visible.
    """
    import os, random, sys, time
    import subprocess

    # NAT is available -> install runtime deps.
    for pkg in ("psycopg2-binary==2.9.9", "boto3==1.35.36"):
        try:
            __import__(pkg.split("==")[0].replace("-binary",""))
        except ImportError:
            subprocess.check_call([sys.executable,"-m","pip","install","-q",pkg])

    import psycopg2
    import boto3

    DB = dict(
        host=os.environ["DB_HOST"], port=int(os.environ.get("DB_PORT","5432")),
        dbname=os.environ["DB_NAME"], user=os.environ["DB_USER"],
        password=os.environ["DB_PASSWORD"], connect_timeout=5,
    )
    SCALE = int(os.environ.get("PGBENCH_SCALE", "1500"))
    NACCOUNTS = SCALE * 100_000
    NBRANCHES = SCALE
    NTELLERS  = SCALE * 10
    REGION = os.environ.get("AWS_REGION","us-east-1")

    cw = boto3.client("cloudwatch", region_name=REGION)

    def run_round():
        """One ~60s round of pgbench -N transactions. Returns count."""
        deadline = time.time() + 60
        n = 0
        with psycopg2.connect(**DB) as conn:
            with conn.cursor() as cur:
                while time.time() < deadline:
                    aid    = random.randint(1, NACCOUNTS)
                    bid    = random.randint(1, NBRANCHES)
                    tid    = random.randint(1, NTELLERS)
                    delta  = random.randint(-5000, 5000)
                    # pgbench -N transaction: skip branches/tellers
                    # updates that contend on the small lookup tables.
                    cur.execute("UPDATE pgbench_accounts SET abalance = abalance + %s WHERE aid = %s",
                                (delta, aid))
                    cur.execute("SELECT abalance FROM pgbench_accounts WHERE aid = %s", (aid,))
                    cur.fetchone()
                    cur.execute("INSERT INTO pgbench_history (tid, bid, aid, delta, mtime) "
                                "VALUES (%s, %s, %s, %s, CURRENT_TIMESTAMP)",
                                (tid, bid, aid, delta))
                    conn.commit()
                    n += 1
        return n

    def publish(tps):
        try:
            cw.put_metric_data(
                Namespace="EksFailDemo/Pgbench",
                MetricData=[{
                    "MetricName":"Tps",
                    "Dimensions":[{"Name":"Target","Value":"ec2-postgres"}],
                    "Value": float(tps), "Unit":"Count/Second",
                }],
            )
        except Exception as e:
            print(f"cloudwatch put_metric_data failed: {e}", flush=True)

    def main():
        # Wait for the DB to be reachable -- gives the EC2 instance time
        # to come up after a CFN stack update replaces it.
        for attempt in range(30):
            try:
                psycopg2.connect(**DB).close()
                break
            except Exception as e:
                print(f"DB not reachable yet ({attempt+1}/30): {e}", flush=True)
                time.sleep(5)
        else:
            print("DB never came up; exiting", flush=True); sys.exit(1)
        print(f"loadgen up against {DB['host']}:{DB['port']}/{DB['dbname']} (scale={SCALE})", flush=True)
        while True:
            try:
                n = run_round()
                tps = n / 60.0
                print(f"tps={tps:.1f} ({n} txn in 60s)", flush=True)
                publish(tps)
            except Exception as e:
                # On disconnects (e.g. when the EC2 is being replaced)
                # log, sleep briefly, and reconnect on the next round.
                print(f"round failed: {e}", flush=True)
                time.sleep(5)

    if __name__ == "__main__":
        main()
