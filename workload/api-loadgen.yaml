---
# Continuous load generator for the API server.
# Sends requests to /health, /query, /write in a tight loop so
# CloudWatch shows visible baseline activity on both the EKS side
# (api-server pod CPU) and the RDS side (DatabaseConnections, IOPS,
# CPU) -- the "healthy state" signal the demo dashboard depends on.
#
# 3 replicas x ~15 req/sec each = ~45 req/sec cluster-wide, which
# yields:
#   RDS DatabaseConnections: 3-6 sustained (short-lived per request)
#   RDS WriteIOPS:           ~15 sustained (from /write inserts)
#   api-server pod CPU:      2-5% baseline (visible on the dashboard)
#
# When the demo breaks the API path (rds-break-sg.sh, feature/tighten-
# probes merge, etc.) the FAIL rate becomes obvious in these logs.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-loadgen
  namespace: api-demo
  labels:
    app: api-loadgen
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-loadgen
  template:
    metadata:
      labels:
        app: api-loadgen
    spec:
      containers:
        - name: loadgen
          image: public.ecr.aws/docker/library/python:3.12-slim
          command:
            - python
            - -c
            - |
              import urllib.request, time, json, sys

              API = "http://api-server.api-demo.svc.cluster.local"
              endpoints = ["/health", "/query", "/write"]

              print("API loadgen started", flush=True)
              while True:
                  for ep in endpoints:
                      try:
                          req = urllib.request.urlopen(f"{API}{ep}", timeout=5)
                          data = json.loads(req.read())
                          status = "OK"
                      except Exception as e:
                          status = f"FAIL: {e}"
                      ts = time.strftime("%H:%M:%S")
                      print(f"[{ts}] {ep:8s} -> {status}", flush=True)
                  # Short sleep so the dashboard shows continuous activity
                  # rather than a once-per-second sawtooth.
                  time.sleep(0.2)
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
