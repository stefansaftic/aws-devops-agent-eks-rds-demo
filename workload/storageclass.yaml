apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
  # tagSpecification_N is read by the EBS CSI driver and applied to every
  # dynamically-provisioned volume at CreateVolume time. Without this,
  # SpringClean (cost-cleanup automation) flags the volumes as orphaned.
  tagSpecification_1: "auto-delete=never"
